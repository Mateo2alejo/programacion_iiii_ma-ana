<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox para Tablero de Estadísticas de Fútbol</title>
    <link rel="stylesheet" href="07_flexbox.css"> 
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Tablero de Estadísticas (FLEXBOX)</h1>
    
    <div class="contenedor">
        
        <div class="item">

        </div>
        
        <div class="item_especial">

        <div class="item">

        </div>

        </div>

    </div>
