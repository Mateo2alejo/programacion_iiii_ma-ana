<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Estadísticas (CSS Grid)</title>
    <link rel="stylesheet" href="08_grid.css"> 
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Scoreboard (CSS Grid Layout 3x3)</h1>
    
    <div class="grid">
        
        <div class="item">GOLES<br> 3</div>
        
        <div class="item">POSESIÓN<br> 55%</div>
        
        <div class="item">GOLES<br> 1</div>
        
        <div class="item">TIROS A PUERTA<br> 8</div>
        
        </div>

    <p style="text-align: center;">
        El contenedor Grid define un espacio de 3 columnas x 3 filas. Aunque solo hay 4 elementos `item` en el HTML, el **Grid Container** crea la estructura de 9 celdas y ubica los ítems en las primeras 4.
    </p>

</body>
</html>
