<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Manipulación de Estilos</title>

  <style>
    #cuadro {
      background-color: black;
      border-radius: 10px;
      transition: all 0.5s ease;
      width: 100px;
      height: 100px;
    }

    button {
      margin-right: 10px;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Manipular Estilos</h1>

  <div id="cuadro"></div>

  <div style="margin-top:20px;">
    <button onclick="cambiarColor()">🎨 Cambiar Color</button>
    <button onclick="aumentarTamano()">⬆️ Aumentar Tamaño</button>
    <button onclick="reiniciar()">🔄 Reiniciar</button>
  </div>

  <script src="09_estilos_mp.js"></script>
</body>
</html>
